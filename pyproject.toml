[project]
name = "freelance-tax-cli"
version = "1.0.0"
description = "Estimate US self-employment tax (15.3%) on freelance net profit. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
freelance-tax = "tax:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tax"]
