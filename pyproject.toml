[project]
name = "freelance-tax-cli"
version = "1.0.0"
description = "Estimate US self-employment tax (15.3%) on freelance net profit. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "self-employment-tax", "tax-calculator", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-tax-cli"
Repository = "https://github.com/kleogeos/freelance-tax-cli"

[project.scripts]
freelance-tax = "tax:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tax"]
